---
- name: Deploy telemt binary
  hosts: telemt
  become: true

  vars:
    binary_src: "~/src/telemt/target/release/telemt"
    binary_dst: "/opt/telemt/telemt"

  tasks:
    - name: Upload new binary
      ansible.builtin.copy:
        src: "{{ binary_src }}"
        dest: "{{ binary_dst }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart telemt

    - name: Restart service immediately if binary changed
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Restart telemt
      ansible.builtin.systemd:
        name: telemt
        state: restarted
