---
- name: Upgrade Debian based servers
  hosts: debian
  become: true
  gather_facts: false
  strategy: free

  tasks:
    - name: Upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true

    - name: Check if reboot required
      ansible.builtin.command: test -f /var/run/reboot-required
      register: reboot_required
      failed_when: false
      changed_when: false

    - name: Reboot server
      ansible.builtin.reboot:
        reboot_timeout: 1800
      when: reboot_required.rc == 0